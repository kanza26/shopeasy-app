name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test-and-scan:
    name: Test and Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test-and-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build backend image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:${{ env.IMAGE_TAG }} ./backend

      - name: Build frontend image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:${{ env.IMAGE_TAG }} ./frontend

      - name: Push backend image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:${{ env.IMAGE_TAG }}

      - name: Push frontend image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:${{ env.IMAGE_TAG }}

  update-deploy-repo:
    name: Update Deploy Repo
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: kanza26/shopeasy-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: shopeasy-deploy

      - name: Update image tags in dev overlay
        run: |
          cd shopeasy-deploy
          
          python3 << PYEOF
          import re
          
          with open('k8s/overlays/dev/kustomization.yaml', 'r') as f:
              content = f.read()
          
          content = re.sub(
              r'(name: 902685116131\.dkr\.ecr\.ap-south-1\.amazonaws\.com/shopeasy-backend\n\s+newTag: ).*',
              r'\g<1>${{ github.sha }}',
              content
          )
          
          content = re.sub(
              r'(name: 902685116131\.dkr\.ecr\.ap-south-1\.amazonaws\.com/shopeasy-frontend\n\s+newTag: ).*',
              r'\g<1>${{ github.sha }}',
              content
          )
          
          with open('k8s/overlays/dev/kustomization.yaml', 'w') as f:
              f.write(content)
          PYEOF
          
          cat k8s/overlays/dev/kustomization.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "Update images to ${{ github.sha }}" || echo "No changes"
          git push